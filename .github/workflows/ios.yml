name: Build and test iOS app

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run iOS simulator tests (slower)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Build iPhone app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAIStudio.xcodeproj \
            -scheme LocalAIStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/LocalAIStudio.app Payload/
          zip -qr LocalAIStudio-unsigned.ipa Payload
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('LocalAIStudio-unsigned.ipa') as ipa:
              app = 'Payload/LocalAIStudio.app/'
              info = plistlib.loads(ipa.read(app + 'Info.plist'))
              for key in ('CFBundleVersion', 'CFBundleShortVersionString'):
                  assert info.get(key), f'Missing {key} from app bundle'
              assert ipa.getinfo(app + info['CFBundleExecutable']).file_size > 0
              assert ipa.getinfo(app + 'Frameworks/CLiteRTLM.framework/CLiteRTLM').file_size > 0
              assert ipa.testzip() is None, 'Corrupt IPA entry'
          print('Unsigned IPA structure and app version metadata verified.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAIStudio-unsigned
          path: LocalAIStudio-unsigned.ipa
          if-no-files-found: error

      - name: Select an available iOS 26 iPhone simulator
        if: ${{ inputs.run_tests }}
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output([
              'xcrun', 'simctl', 'list', 'devices', 'available', '--json'
          ]))['devices']
          iphones = [device for runtime, items in devices.items()
                     if '.iOS-26-' in runtime
                     for device in items if device['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No available iOS 26 iPhone simulator on this runner')
          device = iphones[0]
          print(f"Using {device['name']}: {device['udid']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"id={device['udid']}\n")
          PY

      - name: Build simulator test targets
        if: ${{ inputs.run_tests }}
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAIStudio.xcodeproj \
            -scheme LocalAIStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee test-build.log

      - name: Prepare real Files picker fixtures
        if: ${{ inputs.run_tests }}
        id: fixtures
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          products = pathlib.Path('DerivedData/Build/Products')
          debug = plistlib.loads((products / 'Debug-iphonesimulator/LocalAIStudio.app/Info.plist').read_bytes())
          release = plistlib.loads((products / 'Release-iphoneos/LocalAIStudio.app/Info.plist').read_bytes())
          for key in ('UIFileSharingEnabled', 'LSSupportsOpeningDocumentsInPlace'):
              assert debug.get(key) is True, (key, debug.get(key))
              assert key not in release or release[key] is False, (key, release[key])
          print('Files fixture access is enabled only in the Debug test app.')
          PY
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" DerivedData/Build/Products/Debug-iphonesimulator/LocalAIStudio.app
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" dev.example.localaistudio data)
          export APP_CONTAINER
          python3 - <<'PY'
          import os, pathlib, struct
          documents = pathlib.Path(os.environ['APP_CONTAINER']) / 'Documents'
          documents.mkdir(exist_ok=True)
          # A 36-byte header exercises file selection and import, not model inference.
          header = b'LITERTLM' + struct.pack('<IIIIQ', 1, 9, 0, 0, 36) + bytes(4)
          (documents / 'UI-Import-Test.litertlm').write_bytes(header)
          (documents / 'UI-Unsupported-File.txt').write_text('An ordinary file, not model weights.\n')
          PY

      - name: Run unit and UI tests
        if: ${{ inputs.run_tests }}
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAIStudio.xcodeproj \
            -scheme LocalAIStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee test.log

      - name: Verify import sources remain intact
        if: ${{ always() && inputs.run_tests && steps.fixtures.outcome == 'success' }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          APP_CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" dev.example.localaistudio data)
          export APP_CONTAINER
          python3 - <<'PY'
          import os, pathlib, struct
          documents = pathlib.Path(os.environ['APP_CONTAINER']) / 'Documents'
          header = b'LITERTLM' + struct.pack('<IIIIQ', 1, 9, 0, 0, 36) + bytes(4)
          assert (documents / 'UI-Import-Test.litertlm').read_bytes() == header
          assert (documents / 'UI-Unsupported-File.txt').read_text() == 'An ordinary file, not model weights.\n'
          print('Selected source files are unchanged after UI tests.')
          PY

      - name: Export test screenshots
        if: ${{ always() && inputs.run_tests }}
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path TestResults.xcresult \
              --output-path Screenshots
          fi

      - name: Upload test screenshots
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIStudio-screenshots
          path: Screenshots
          if-no-files-found: warn

      - name: Upload build logs and test results
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIStudio-test-results
          path: |
            build.log
            test-build.log
            test.log
            TestResults.xcresult
          if-no-files-found: warn
