name: Build unsigned iOS IPA

on:
  pull_request:
    branches: [main]
    paths:
      - "Resources/AppIcon.icon/**"
      - ".github/workflows/ios.yml"
      - "project.yml"
  workflow_dispatch:
    inputs:
      icon_only:
        description: "Compile only the Icon Composer .icon asset (faster)"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Run iOS simulator tests (slower)"
        required: false
        type: boolean
        default: false

jobs:
  icon:
    if: ${{ github.event_name == 'pull_request' || inputs.icon_only }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Compile Icon Composer artwork
        run: |
          xcodebuild -version
          mkdir -p build/icon
          xcrun actool Resources/AppIcon.icon \
            --compile build/icon \
            --platform iphoneos \
            --minimum-deployment-target 26.0 \
            --target-device iphone \
            --app-icon AppIcon \
            --bundle-identifier dev.example.localaistudio \
            --output-format human-readable-text \
            --output-partial-info-plist build/icon/icon-partial-info.plist \
            --notices --warnings --errors
          test -s build/icon/Assets.car

      - name: Render Apple material previews
        run: |
          icon_developer_dir="$(xcode-select -p)"
          icon_tool="${icon_developer_dir%/Developer}/Applications/Icon Composer.app/Contents/Executables/ictool"
          "$icon_tool" --version
          for appearance in Default Dark TintedLight TintedDark ClearLight ClearDark; do
            "$icon_tool" Resources/AppIcon.icon \
              --export-image \
              --output-file "build/icon/preview-${appearance}.png" \
              --platform iOS \
              --rendition "$appearance" \
              --width 1024 --height 1024 --scale 1
          done
          "$icon_tool" Resources/AppIcon.icon \
            --export-image \
            --output-file build/icon/preview-Default-iOS26.png \
            --platform iOS --rendition Default \
            --width 1024 --height 1024 --scale 1 \
            --design-generation 26

      - name: Compare glass material strengths
        run: |
          python3 - <<'PY'
          import copy, json, pathlib, shutil, subprocess
          source = pathlib.Path('Resources/AppIcon.icon')
          original = json.loads((source / 'icon.json').read_text())
          developer = pathlib.Path(subprocess.check_output(['xcode-select', '-p'], text=True).strip())
          tool = developer.parent / 'Applications/Icon Composer.app/Contents/Executables/ictool'
          for name, depth, strength, translucent in [
              ('Deep', 0.55, 0.75, True),
              ('Crisp', 0.15, 0.9, True),
              ('Saturated', 0.45, 0.7, False)]:
              manifest = copy.deepcopy(original)
              manifest['features'] = ['refractivity', 'specular-location']
              for group in manifest['groups'][1:]:
                  group['refractivity'] = {'enabled': True, 'depth': depth, 'strength': strength}
                  group['specular'] = 'inside'
                  group['shadow']['opacity'] = 0.22
                  group['translucency']['enabled'] = translucent
              work = pathlib.Path('build/material-comparison') / name / 'AppIcon.icon'
              shutil.copytree(source, work)
              (work / 'icon.json').write_text(json.dumps(manifest))
              subprocess.run([str(tool), str(work), '--export-image',
                              '--output-file', f'build/icon/material-{name}.png',
                              '--platform', 'iOS', '--rendition', 'Default',
                              '--width', '1024', '--height', '1024', '--scale', '1',
                              '--design-generation', '27'], check=True)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAIStudio-IconComposer
          path: |
            build/icon/
            Resources/AppIcon.icon
          if-no-files-found: error

  build:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.icon_only }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Build iPhone app without signing
        run: |
          xcodebuild \
            -project LocalAIStudio.xcodeproj \
            -scheme LocalAIStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/LocalAIStudio.app Payload/
          zip -qr LocalAIStudio-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAIStudio-unsigned
          path: LocalAIStudio-unsigned.ipa

