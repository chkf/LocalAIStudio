name: LocalAIStudio
options:
  deploymentTarget:
    iOS: "26.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CURRENT_PROJECT_VERSION: "7"
    MARKETING_VERSION: "0.5.0"

packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx.git
    revision: af2d8d81dbfa61c4cea4c568da78f3982edca005
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM.git
    # Official v0.18.1 release: keep Swift wrappers and XCFramework on the same release.
    revision: bda624851d74be34d4e1f7fac1fc4155939539c7
  LlamaSwift:
    url: https://github.com/mattt/llama.swift.git
    exactVersion: 2.10549.0
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.32.3
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.3.0
  MediaGenerationKit:
    url: https://github.com/drawthingsai/media-generation-kit.git
    revision: 37e0b70092ad1a0c1d4c6b24f16e17b73f1b1fb3

targets:
  LocalAIStudio:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Resources/en.lproj/Localizable.strings
        buildPhase: resources
      - path: Resources/zh-Hans.lproj/Localizable.strings
        buildPhase: resources
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: LiteRTLM
        product: LiteRTLM
      - package: LlamaSwift
        product: LlamaSwift
      - target: MLXBackend
        embed: true
      - package: MediaGenerationKit
        product: MediaGenerationKit
    settings:
      base:
        # Preserve bundle identity and the existing app/model container on upgrade.
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio
        INFOPLIST_KEY_CFBundleDisplayName: AI Studio
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Retained for document interoperability; the import picker now requests copies.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Keep MLX's metal-cpp implementation in its own dynamic image, separate from NNC.
  MLXBackend:
    type: framework
    platform: iOS
    sources:
      - path: MLXBackend
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio.mlx
        SKIP_INSTALL: YES
  LocalAIStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LocalAIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio.tests
  LocalAIStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - ImportFixtureHost
    dependencies:
      - target: LocalAIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio.uitests
        TEST_TARGET_NAME: LocalAIStudio
  ImportFixtureHost:
    type: application
    platform: iOS
    sources:
      - path: UITests/ImportFixtureHost
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio.importfixtures
        INFOPLIST_FILE: UITests/ImportFixtureHost/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  LocalAIStudio:
    build:
      targets:
        LocalAIStudio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalAIStudioTests
        - LocalAIStudioUITests
    archive:
      config: Release
  ImportFixtureHost:
    build:
      targets:
        ImportFixtureHost: all
    run:
      config: Debug
