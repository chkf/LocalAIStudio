name: LocalAIStudio
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM.git
    # Official v0.18.1 release: keep Swift wrappers and XCFramework on the same release.
    revision: bda624851d74be34d4e1f7fac1fc4155939539c7

targets:
  LocalAIStudio:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio
        INFOPLIST_KEY_CFBundleDisplayName: Local AI Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          # Let UI tests select tiny fixtures seeded by CI through the actual Files picker.
          # Release builds do not expose the app's Documents directory.
          INFOPLIST_FILE: UITests/ImportTestInfo.plist
  LocalAIStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LocalAIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio.tests
  LocalAIStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - ImportTestInfo.plist
    dependencies:
      - target: LocalAIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.localaistudio.uitests
        TEST_TARGET_NAME: LocalAIStudio
schemes:
  LocalAIStudio:
    build:
      targets:
        LocalAIStudio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalAIStudioTests
        - LocalAIStudioUITests
    archive:
      config: Release
